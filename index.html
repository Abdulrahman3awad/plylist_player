<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="style.css">
<title>Playlist Player</title>
<link rel="icon" href="youtube.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Cairo:wght@200..1000&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap');
</style>
</head>
<body>
  <main class="container">
    <h1> Playlist Player <span> ▶ </span></h1>
    <p class="subtitle">حط لينك القائمة واضغط تحميل </p>

    <form class="form" id="form">
      <input id="url" type="text" placeholder="https://www.youtube.com/playlist?list=PL..." autocomplete="off" spellcheck="false">
      <button type="submit" id="submit">تحميل </button>
    </form>
    <p class="error" id="error" role="alert"></p>

    <section class="layout">
      <div class="player-wrap">
        <div id="player"></div>
        <div class="placeholder" id="placeholder">
          <div><span>🎬</span>الفيديو هيظهر هنا   </div>
        </div>
      </div>

      <aside class="list-panel">
        <div class="list-inner">
          <div class="list-header">
            <h2 id="list-title">Playlist</h2>
            <p id="list-meta">الفيديوهات هتظهر هنا بعد ما تعمل تحميل</p>
          </div>
          <div class="list-scroll" id="list"></div>
        </div>
      </aside>
    </section>
  </main>

<script>

  // =====================================================
  // 2) State + DOM references
  // =====================================================
  let videos = [];          // [{ id, title, channel, thumb, duration }]
  let currentIndex = -1;
  let playlistMeta = { title: "", channel: "" };
  let ytPlayer = null;      // YT.Player instance
  let playerReady = null;   // Promise that resolves when the player is ready

  const form = document.getElementById("form");
  const input = document.getElementById("url");
  const submitBtn = document.getElementById("submit");
  const errorEl = document.getElementById("error");
  const placeholder = document.getElementById("placeholder");
  const listEl = document.getElementById("list");
  const listTitle = document.getElementById("list-title");
  const listMeta = document.getElementById("list-meta");

  // =====================================================
  // 3) Load the YouTube IFrame Player API
  // =====================================================
  const ytReady = new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = resolve; // YouTube calls this global function when ready
    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  });

  // =====================================================
  // 4) Helpers
  // =====================================================
  function getPlaylistId(value) {
    const text = value.trim();
    if (!text) return null;
    try {
      const id = new URL(text).searchParams.get("list");
      if (id) return id;
    } catch (e) { /* not a URL, maybe a raw ID */ }
    return /^[A-Za-z0-9_-]{10,}$/.test(text) ? text : null;
  }

  // "PT1H2M3S" -> "1:02:03"
  function formatDuration(iso) {
    const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || "");
    if (!m) return "";
    const h = Number(m[1] || 0), min = Number(m[2] || 0), s = Number(m[3] || 0);
    const ss = String(s).padStart(2, "0");
    return h ? `${h}:${String(min).padStart(2, "0")}:${ss}` : `${min}:${ss}`;
  }

  // Create an element safely (textContent, never innerHTML -> no XSS)
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  async function api(endpoint, params) {
  const url = new URL("/api/youtube", location.origin);
  url.searchParams.set("endpoint", endpoint);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== "") url.searchParams.set(k, v);
  });
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || `Request failed (${res.status})`);
  return data;
}

  // =====================================================
  // 5) Fetch the playlist data from YouTube Data API v3
  // =====================================================
  async function fetchPlaylist(playlistId) {
    // a) playlist title + channel
    const meta = await api("playlists", { part: "snippet", id: playlistId });
    if (!meta.items?.length) throw new Error("الـ playlist مش موجودة أو Private.");
    playlistMeta = {
      title: meta.items[0].snippet.title,
      channel: meta.items[0].snippet.channelTitle,
    };

    // b) all videos (50 per page, so we loop with nextPageToken)
    const items = [];
    let pageToken = "";
    do {
      const page = await api("playlistItems", {
        part: "snippet,contentDetails",
        playlistId,
        maxResults: 50,
        pageToken,
      });
      items.push(...page.items);
      pageToken = page.nextPageToken || "";
    } while (pageToken);

    const list = items
      .filter((i) => !["Private video", "Deleted video"].includes(i.snippet.title))
      .map((i) => ({
        id: i.contentDetails.videoId,
        title: i.snippet.title,
        channel: i.snippet.videoOwnerChannelTitle || playlistMeta.channel,
        thumb: i.snippet.thumbnails?.medium?.url || i.snippet.thumbnails?.default?.url || "",
        duration: "",
      }));

    // c) durations come from a different endpoint (videos), up to 50 IDs per call
    for (let i = 0; i < list.length; i += 50) {
      const chunk = list.slice(i, i + 50);
      const data = await api("videos", { part: "contentDetails", id: chunk.map((v) => v.id).join(",") });
      const map = new Map(data.items.map((v) => [v.id, v.contentDetails.duration]));
      chunk.forEach((v) => (v.duration = formatDuration(map.get(v.id))));
    }

    return list;
  }

  // =====================================================
  // 6) Render the list
  // =====================================================
  function renderList() {
    listTitle.textContent = playlistMeta.title;
    listTitle.dir = "auto";
    listEl.replaceChildren();

    videos.forEach((video, index) => {
      const item = el("button", "video-item");
      item.type = "button";
      item.dataset.index = index;

      const num = el("span", "video-index", String(index + 1));

      const thumb = el("div", "thumb");
      const img = document.createElement("img");
      img.src = video.thumb;
      img.alt = "";
      img.loading = "lazy";
      thumb.append(img, el("span", "duration", video.duration));

      const info = el("div");
      const title = el("div", "video-title", video.title);
      title.dir = "auto";
      info.append(title, el("div", "video-channel", video.channel));

      item.append(num, thumb, info);
      item.addEventListener("click", () => selectVideo(index, true));
      listEl.appendChild(item);
    });
  }

  function paintActive() {
    listEl.querySelectorAll(".video-item").forEach((node) => {
      const isActive = Number(node.dataset.index) === currentIndex;
      node.classList.toggle("active", isActive);
      if (isActive) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    listMeta.textContent = `${currentIndex + 1} من أصل ${videos.length} - ${playlistMeta.channel}`;
  }

  // =====================================================
  // 7) Player control
  // =====================================================
  function createPlayer(videoId, autoplay) {
    playerReady = new Promise((resolve) => {
      ytPlayer = new YT.Player("player", {
        videoId,
        playerVars: { autoplay: autoplay ? 1 : 0, rel: 0, playsinline: 1 },
        events: {
          onReady: resolve,
          onStateChange: (e) => {
            // When a video ends, play the next one
            if (e.data === YT.PlayerState.ENDED && currentIndex < videos.length - 1) {
              selectVideo(currentIndex + 1, true);
            }
          },
          onError: () => {
            errorEl.textContent = "الفيديو ده مش بيسمح بالـ embed أو فيه مشكلة — جرب فيديو تاني.";
          },
        },
      });
    });
  }

  async function selectVideo(index, autoplay) {
    currentIndex = index;
    errorEl.textContent = "";
    placeholder.style.display = "none";
    paintActive();

    await ytReady;
    const id = videos[index].id;

    if (!ytPlayer) {
      createPlayer(id, autoplay);
    } else {
      await playerReady;
      autoplay ? ytPlayer.loadVideoById(id) : ytPlayer.cueVideoById(id);
    }
  }

  // =====================================================
  // 8) Form submit
  // =====================================================
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorEl.textContent = "";

    const id = getPlaylistId(input.value);
    if (!id) {
      errorEl.textContent = "اللينك مش مظبوط — لازم يكون فيه list=... زي لينك الـ playlist.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Loading...";
    try {
      videos = await fetchPlaylist(id);
      if (!videos.length) throw new Error("مفيش فيديوهات متاحة في الـ playlist دي.");
      renderList();
      await selectVideo(0, false); // show the first video without autoplay
    } catch (err) {
      errorEl.textContent = "حصل error: " + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "تحميل";
    }
  });
</script>
</body>
</html>
